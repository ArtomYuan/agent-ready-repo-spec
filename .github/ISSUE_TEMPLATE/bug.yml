name: 问题反馈
description: 规则的判据不对、章节表述有歧义、模板不好用
title: "[issue] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        这是文档库，没有检查器可跑。反馈时请说清"哪一条 / 哪一章 / 你期望它怎么说"。
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 规则的判据不对（太严 / 太松 / 无法判定）
        - 章节表述有歧义或例子跑不通
        - 模板不好用（缺字段 / 多余字段）
        - 路径或链接失效
        - 其他
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 位置
      description: 规则 ID（如 R033）或文件路径 + 小标题
      placeholder: R___  /  guide/03-文档该怎么写.md §2
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 现状 vs 期望
      description: 现在文档怎么说、你希望它怎么说、以及为什么（最好给出一个真实的仓库反例）
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: specVersion / commit
      placeholder: 1.6.0